[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veg_price_forecasting"
version = "1.0.0"
description = "Sri Lankan Market Vegetable Price Forecasting Framework"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
